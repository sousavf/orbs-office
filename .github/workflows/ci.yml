name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: |
          bun install --frozen-lockfile
          cd worker && bun install --frozen-lockfile
      - name: Type check
        run: |
          bun run check
          cd worker && ./node_modules/.bin/tsc --noEmit
      - name: Test
        run: bun run test
      - name: Build
        run: |
          bun run build
          bun run build:public
      - name: Public bundle contains no private code
        run: |
          for marker in pairing conversation office-settings avatar-relay localStorage __office3d __record; do
            if grep -q -- "$marker" worker/public-dist/assets/*.js worker/public-dist/index.html; then
              echo "::error::public bundle contains '$marker'"
              exit 1
            fi
          done
